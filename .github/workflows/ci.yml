name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        env:
          FLASK_CONFIG: testing
          SECRET_KEY: ci-test-secret
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

  build:
    name: Build verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify app boots and DB initialises
        env:
          FLASK_CONFIG: production
          SECRET_KEY: ${{ github.sha }}
          SESSION_COOKIE_SECURE: "false"
        run: |
          python -c "from app import create_app; from app.extensions import db; \
            app = create_app('production'); \
            ctx = app.app_context(); ctx.push(); db.create_all(); \
            print('Build verification passed: app boots and DB initialises'); ctx.pop()"
      - name: Smoke-test health endpoint
        env:
          FLASK_CONFIG: production
          SECRET_KEY: ${{ github.sha }}
        run: |
          python -c "from app import create_app; \
            c = create_app('production').test_client(); \
            r = c.get('/healthz'); assert r.status_code == 200, r.status_code; \
            print('Health check OK:', r.get_json())"
